<div
  class="pointer-events-none fixed inset-x-0 top-4 z-50 flex flex-col items-center gap-2 px-4"
  aria-live="polite"
>
  @for (toast of toastService.toasts(); track toast.id) {
    <div
      class="pointer-events-auto flex w-full max-w-md items-start gap-3 rounded-lg px-4 py-3 text-sm shadow-lg"
      [class]="classesFor(toast.kind)"
      role="status"
    >
      <span class="flex-1">{{ toast.message }}</span>
      <button
        type="button"
        class="opacity-80 hover:opacity-100"
        aria-label="Dismiss"
        (click)="toastService.dismiss(toast.id)"
      >
        ✕
      </button>
    </div>
  }
</div>
